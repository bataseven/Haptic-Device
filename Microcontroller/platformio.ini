; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; "pio run" only builds the firmware. The native environment is only for the unit tests.
default_envs = teensy40

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200
; The unit tests run on the computer, see env:native
test_ignore = *
lib_deps =
	frankjoshua/Rosserial Arduino Library@^0.9.1
	paulstoffregen/OctoWS2811 @ ^1.5
	dfrobot/DFRobot_BMX160@^1.0.1
	; nut-code-monkey/Fusion AHRS@^1.0.1

; Unit tests that run on the computer: pio test -e native
; Needs gcc, e.g. on Linux, macOS, or WSL on Windows. test/native_stubs replaces the Arduino core and the Encoder library.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++14 -I test/native_stubs
